<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Toggle</title>

<!--
  Blocking, inline, runs before any CSS paints. Reads saved choice or
  falls back to system preference, then sets data-theme on <html>
  immediately — this is what prevents the flash of wrong theme.
-->
<script>
  (function () {
    const stored = localStorage.getItem("theme");
    const theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>

<style>
  :root {
    --mono: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
  }

  /* Dark theme (default palette) */
  html[data-theme="dark"] {
    --bg: #14151a;
    --panel: #1b1d24;
    --border: #2c2f38;
    --text: #e4e4e2;
    --muted: #8b8d98;
    --accent: #d99a2b;
    --accent-contrast: #14151a;
  }

  /* Light theme — deliberately warm, not an inversion */
  html[data-theme="light"] {
    --bg: #f7f5f0;
    --panel: #ffffff;
    --border: #e2ddd1;
    --text: #262420;
    --muted: #7a7568;
    --accent: #b5701f;
    --accent-contrast: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 64px 20px;
    margin: 0;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    transition: background 0.25s ease, border-color 0.25s ease;
  }

  .card__eyebrow {
    color: var(--accent);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 8px;
  }

  .card__title {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 12px;
  }

  .card__text {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 20px;
  }

  .card a {
    color: var(--accent);
  }

  .card a:hover {
    text-decoration: none;
  }

  .card a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn-demo {
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 6px;
    cursor: pointer;
  }

  .btn-demo:hover { opacity: 0.88; }

  /* --- theme toggle button --- */
  #theme-toggle {
    position: relative;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s ease, border-color 0.25s ease;
  }

  #theme-toggle:hover {
    border-color: var(--accent);
  }

  #theme-toggle svg {
    position: absolute;
    width: 20px;
    height: 20px;
    color: var(--accent);
    transition: transform 0.4s ease, opacity 0.3s ease;
  }

  .icon-sun {
    opacity: 0;
    transform: rotate(-90deg) scale(0.5);
  }

  .icon-moon {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }

  html[data-theme="light"] .icon-sun {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }

  html[data-theme="light"] .icon-moon {
    opacity: 0;
    transform: rotate(90deg) scale(0.5);
  }
</style>
</head>
<body>

<button id="theme-toggle" aria-label="Toggle color theme">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
  </svg>
</button>

<div class="card">
  <p class="card__eyebrow">Preview</p>
  <h2 class="card__title">Theme-aware card</h2>
  <p class="card__text">This card uses only CSS custom properties for color, so switching themes restyles everything at once — background, borders, text, links, and the accent color, no per-element overrides.</p>
  <a href="#" onclick="return false;">A focusable link</a>
  <br><br>
  <button class="btn-demo">Demo button</button>
</div>

<script>
  const toggle = document.getElementById("theme-toggle");
  const html = document.documentElement;

  toggle.addEventListener("click", () => {
    const current = html.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    html.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  });

  // Follow system changes only if the user hasn't made an explicit choice yet
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
    if (localStorage.getItem("theme")) return;
    html.setAttribute("data-theme", e.matches ? "dark" : "light");
  });
</script>

</body>
</html>
