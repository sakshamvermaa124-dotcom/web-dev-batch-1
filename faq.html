<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ</title>
<style>
  :root {
    --bg: #14151a;
    --panel: #1b1d24;
    --border: #2c2f38;
    --text: #e4e4e2;
    --muted: #8b8d98;
    --amber: #d99a2b;
    --mono: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    display: flex;
    justify-content: center;
    padding: 64px 20px;
    margin: 0;
  }

  .faq {
    width: 100%;
    max-width: 640px;
  }

  .faq__eyebrow {
    color: var(--amber);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 8px;
  }

  .faq__title {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 32px;
    color: var(--text);
  }

  .faq-item {
    border-bottom: 1px solid var(--border);
  }

  .faq-item:first-child {
    border-top: 1px solid var(--border);
  }

  .faq-question {
    width: 100%;
    background: none;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    text-align: left;
    padding: 18px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    cursor: pointer;
  }

  .faq-question:hover .faq-question__text {
    color: var(--amber);
  }

  .faq-question:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .faq-question__text {
    transition: color 0.15s ease;
  }

  .faq-toggle {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    position: relative;
    color: var(--muted);
  }

  .faq-toggle::before,
  .faq-toggle::after {
    content: "";
    position: absolute;
    background: currentColor;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.25s ease;
  }

  .faq-toggle::before {
    width: 12px;
    height: 2px;
  }

  .faq-toggle::after {
    width: 2px;
    height: 12px;
  }

  .faq-item.is-open .faq-toggle {
    color: var(--amber);
  }

  .faq-item.is-open .faq-toggle::after {
    transform: translate(-50%, -50%) rotate(90deg) scaleY(0);
  }

  .faq-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }

  .faq-answer__inner {
    padding: 0 4px 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="faq">
  <p class="faq__eyebrow">FAQ</p>
  <h2 class="faq__title">Things people ask</h2>

  <div class="faq-list" id="faq-list"></div>
</div>

<script>
  const faqData = [
    {
      q: "What's your core stack?",
      a: "LangChain/LangGraph for orchestration, FastAPI with async I/O for serving, Redis for caching and job queues, and Docker for shipping it all. Most of what I build sits on top of that."
    },
    {
      q: "What kind of AI systems do you work on?",
      a: "Mostly agentic systems and RAG pipelines — multi-agent pipelines with critic/retry loops, PR review automation, and retrieval-augmented assistants. I've also fine-tuned Mistral-7B with QLoRA/PEFT for domain-specific tasks."
    },
    {
      q: "Do you work on production systems or just prototypes?",
      a: "Both. Day to day I build and ship AI agents and LLM-based products for clients as part of an engineering team, alongside personal projects I take from idea to deployed."
    },
    {
      q: "What's your approach to competitive programming?",
      a: "I treat it as a separate discipline from systems work — it keeps my fundamentals sharp: algorithms, data structures, and thinking clearly under constraints."
    },
    {
      q: "Are you open to freelance or collaboration?",
      a: "Yes — particularly on agentic AI, RAG, or backend systems work. Reach out through the contact section and I'll get back to you."
    }
  ];

  const list = document.getElementById("faq-list");

  faqData.forEach((item, i) => {
    const id = `faq-${i}`;

    const wrapper = document.createElement("div");
    wrapper.className = "faq-item";

    wrapper.innerHTML = `
      <button class="faq-question" id="${id}-btn" aria-expanded="false" aria-controls="${id}-panel">
        <span class="faq-question__text">${item.q}</span>
        <span class="faq-toggle" aria-hidden="true"></span>
      </button>
      <div class="faq-answer" id="${id}-panel" role="region" aria-labelledby="${id}-btn">
        <div class="faq-answer__inner">${item.a}</div>
      </div>
    `;

    list.appendChild(wrapper);
  });

  const items = Array.from(document.querySelectorAll(".faq-item"));

  function closeItem(item) {
    const btn = item.querySelector(".faq-question");
    const panel = item.querySelector(".faq-answer");
    btn.setAttribute("aria-expanded", "false");
    panel.style.maxHeight = null;
    item.classList.remove("is-open");
  }

  function openItem(item) {
    const btn = item.querySelector(".faq-question");
    const panel = item.querySelector(".faq-answer");
    btn.setAttribute("aria-expanded", "true");
    panel.style.maxHeight = panel.scrollHeight + "px";
    item.classList.add("is-open");
  }

  function toggleItem(item) {
    const isOpen = item.classList.contains("is-open");
    items.forEach(other => {
      if (other !== item) closeItem(other);
    });
    isOpen ? closeItem(item) : openItem(item);
  }

  items.forEach(item => {
    const btn = item.querySelector(".faq-question");
    btn.addEventListener("click", () => toggleItem(item));
  });

  // Keep open panel's max-height correct on resize (text reflow changes scrollHeight)
  window.addEventListener("resize", () => {
    const openItem = document.querySelector(".faq-item.is-open");
    if (openItem) {
      openItem.querySelector(".faq-answer").style.maxHeight =
        openItem.querySelector(".faq-answer").scrollHeight + "px";
    }
  });
</script>

</body>
</html>
